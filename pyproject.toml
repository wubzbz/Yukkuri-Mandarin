[project]
name = "yukkuri-mandarin"
version = "2.0.0"
description = "将汉语转换为“伪日本语”."
keywords = ["mandarin", "普通话", "hiragana", "平仮名"]
authors = [
    {name = "wubzbz", email = "wubzbz@126.com" }
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.9,<4"
dependencies = ["pypinyin>=0.54.0"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Natural Language :: Chinese (Simplified)",
    "Natural Language :: Chinese (Traditional)",
    "Natural Language :: Japanese",
    "Topic :: Text Processing",
    "Topic :: Utilities",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only"
]

[project.optional-dependencies]
openpyxl = ["openpyxl>=3.1.5"]
jieba = ["jieba>=0.42.1"]
all = ["openpyxl>=3.1.5", "jieba>=0.42.1"]

[project.urls]
Homepage = "https://github.com/wubzbz/Yukkuri-Mandarin"
Documentation = "https://github.com/wubzbz/Yukkuri-Mandarin#readme"
Issues = "https://github.com/wubzbz/Yukkuri-Mandarin/issues"
Source = "https://github.com/wubzbz/Yukkuri-Mandarin"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "yukkurimandarin"
module-root = ""

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "flake8>=7.0.0",
    "pyright>=1.1.414",
]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = "tests"

[tool.pyright]
include = ["yukkurimandarin", "tests"]
exclude = ["**/__pycache__", "**/build", "**/dist"]
pythonVersion = "3.9"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
